<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>EcoLoop – Waste Recycling Marketplace</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#16211d;--mut:#6b7872;--line:#e4e8e3;--pri:#0f6b5c;--pri2:#d9f0ea;--acc:#f2994a;--blue:#3b6fd8;--red:#d9534f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1512;--card:#17211d;--ink:#e8efeb;--mut:#8fa098;--line:#26332d;--pri:#37c2a6;--pri2:#173a33}}
:root[data-theme=dark]{--bg:#0e1512;--card:#17211d;--ink:#e8efeb;--mut:#8fa098;--line:#26332d;--pri:#37c2a6;--pri2:#173a33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "DM Sans",system-ui,-apple-system,Segoe UI,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.01em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.logo{font:700 20px Georgia,serif;color:var(--pri);cursor:pointer}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}
nav button{border:0;background:none;color:var(--mut);padding:8px 14px;border-radius:99px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pri2);color:var(--pri);font-weight:600}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--pri2);color:var(--pri);font-weight:600;white-space:nowrap}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.mut{color:var(--mut);font-size:13px}.big{font:700 28px Georgia,serif}
.btn{border:0;background:var(--pri);color:#fff;padding:11px 18px;border-radius:12px;font:600 14px inherit;font-family:inherit;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}.btn.ghost{background:var(--pri2);color:var(--pri)}.btn.red{background:none;color:var(--red);border:1px solid var(--line)}.btn[disabled]{opacity:.4;pointer-events:none}
.badge{font-size:12px;padding:3px 9px;border-radius:99px;font-weight:600}.ok{background:#dff5e6;color:#1d7a43}.bz{background:#fde8d4;color:#b4620f}.bl{background:#e1eafc;color:#2f56ab}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero{padding:44px 24px;border-radius:24px;background:linear-gradient(135deg,var(--pri),#14463d);color:#fff;display:grid;gap:14px}
.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.05}
.tl{list-style:none;margin:0;padding:0}.tl li{display:flex;gap:12px;padding-bottom:14px;position:relative;color:var(--mut)}
.tl li:before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}.tl li:last-child:before{display:none}
.tl i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;background:var(--card);display:grid;place-items:center;font-size:11px;font-style:normal}
.tl li.d{color:var(--ink)}.tl li.d i{background:var(--pri);border-color:var(--pri);color:#fff}.tl li.c i{border-color:var(--acc);animation:pu 1.4s infinite}
@keyframes pu{50%{box-shadow:0 0 0 6px rgba(242,153,74,.25)}}
.item{display:grid;grid-template-columns:90px 1fr 70px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
input[type=range]{width:100%;accent-color:var(--pri)}input[type=number],input[type=text],select{padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;width:100%}
.col{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-top:8px}
.av{width:36px;height:36px;border-radius:50%;background:var(--pri2);color:var(--pri);display:grid;place-items:center;font-weight:700}
table{width:100%;border-collapse:collapse}td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{color:var(--mut);font-weight:500;font-size:12px}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden}.bar b{display:block;height:100%;background:var(--pri);transition:width .6s}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;animation:in .3s;z-index:20;max-width:300px}
.slide{position:relative;height:50px;border-radius:99px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:600;overflow:hidden}.slide input{position:absolute;inset:0;width:100%;height:100%;opacity:.0001;margin:0;cursor:grab}.slide:after{content:"➜";position:absolute;left:6px;top:6px;width:38px;height:38px;border-radius:50%;background:#fff;color:var(--pri);display:grid;place-items:center;pointer-events:none}.nb{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:in .35s;margin-bottom:8px}
#nbs{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));width:min(380px,92vw);z-index:30;pointer-events:none}
#np{position:fixed;right:12px;top:calc(60px + env(safe-area-inset-top,0px));width:min(340px,92vw);max-height:70vh;overflow:auto;z-index:25;display:none}
.ni{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.ni.u{background:var(--pri2);margin:0 -8px;padding:10px 8px;border-radius:10px}
.demo{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15}
svg{max-width:100%;height:auto;display:block}
</style></head><body>
<header><span class="logo" onclick="go('home')">♻ EcoLoop</span><nav id="nav"></nav><span class="pill" id="st"></span><button class="btn ghost" id="bell" onclick="NP=!NP;render()">🔔</button></header><div id="nbs"></div><div id="np" class="card"></div>
<main id="app"></main><div class="demo"><button class="btn ghost" onclick="reset()">↺ Reset demo</button></div>
<script>
const STEPS=["Pickup requested","Finding nearby collector","Collector assigned","Collector arrived","Waste collected","Transferred to recycler","Recycler received","Sorting / processing","Recycled"];
const W=[{k:"Plastic",e:"🧴",r:25,q:8,a:7.5,rs:45},{k:"Paper",e:"📄",r:12,q:5,a:5.2,rs:20},{k:"Metal",e:"🔩",r:45,q:2,a:1.8,rs:75}];
const COL=[["Ravi",0.8,1],["Imran",1.2,1],["Suresh",2.7,0],["Rahul",4.5,1]];
let TL=30,TI=null;let S={v:"home",st:0,who:"Ravi",as:null,persona:"Ravi",on:true,dark:false};
const f=n=>"₹"+n.toFixed(2).replace(/\.00$/,""),est=()=>W.reduce((s,w)=>s+w.q*w.r,0),fin=()=>W.reduce((s,w)=>s+w.a*w.r,0);
const pay=375,proc=60,resale=()=>W.reduce((s,w)=>s+w.a*w.rs,0);
function go(v){S.v=v;render()}function toast(t){let d=document.createElement("div");d.className="toast";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2600)}
function tracker(){return `<ul class="tl">${STEPS.map((t,i)=>{let n=i+1,c=S.st>=n&&!(S.st==n&&n<9)?"d":S.st==n?"c":"";if(S.st==n&&n<9)c="c";if(S.st>=n&&S.st!=n)c="d";if(S.st==9)c="d";return `<li class="${c}"><i>${c=="d"?"✓":n}</i><div>${t}${n==3&&S.st>=3?` — <b>${S.as}</b>`:""}</div></li>`}).join("")}</ul>`}
function map(){let p=Math.min(1,Math.max(0,(S.st-2)/2));if(S.st>=4)p=1;let x=60+(300-60)*p,y=210-(210-90)*p;if(S.st>=3&&S.st<4){x=60+240*.5;y=150}
return `<svg viewBox="0 0 400 260" style="border-radius:14px;background:var(--pri2)"><g stroke="var(--line)" stroke-width="10" fill="none" opacity=".9"><path d="M0 200H400M0 90H400M110 0V260M300 0V260"/></g><path d="M60 210L110 210L110 90L300 90" stroke="var(--pri)" stroke-width="3" stroke-dasharray="7 6" fill="none"/>
<circle cx="300" cy="90" r="12" fill="var(--acc)"/><text x="300" y="70" font-size="11" text-anchor="middle" fill="var(--ink)">🏠 Aman, Indiranagar</text>
${S.st>=2?`<circle cx="${S.st>=4?300:x}" cy="${S.st>=4?90:y}" r="9" fill="var(--blue)"/><text x="${S.st>=4?300:x}" y="${(S.st>=4?90:y)+24}" font-size="11" text-anchor="middle" fill="var(--ink)">🛵 ${S.as||"Ravi"}</text>`:""}
<text x="14" y="248" font-size="12" fill="var(--ink)">${S.st>=3?(S.st>=4?"Arrived · 0 km":"0.8 km · ETA 6 min"):"Searching within 5 km…"}</text></svg>`}
function impact(){let k=W.reduce((s,w)=>s+w.a,0),done=S.st>=5;return `<div class="grid g4">${[["♻️",done?k.toFixed(1)+" kg":"—","Waste recycled"],["🌳",done?(k*.33).toFixed(1)+" kg":"—","CO₂ saved"],["💧",done?Math.round(k*8.3)+" L":"—","Water conserved"],["🏆",done?"340":"—","Recycling points"]].map(a=>`<div class="card"><div style="font-size:24px">${a[0]}</div><div class="big">${a[1]}</div><div class="mut">${a[2]}</div></div>`).join("")}</div>`}
function upd(){let t=est();document.getElementById("est").textContent=f(t);W.forEach((w,i)=>{document.getElementById("v"+i).textContent=f(w.q*w.r);document.getElementById("q"+i).textContent=w.q+" kg"})}
function household(){
if(S.st==0)return `<h2>New pickup</h2><p class="mut">Hi Aman 👋 Add recyclables and pick a slot.</p><div class="grid g2"><div class="card"><b>1 · What are you recycling?</b>${W.map((w,i)=>`<div class="item"><span>${w.e} ${w.k}<br><span class="mut">₹${w.r}/kg</span></span><input type="range" min="0" max="20" value="${w.q}" oninput="W[${i}].q=+this.value;upd()"><span><b id="q${i}">${w.q} kg</b><br><span class="mut" id="v${i}">${f(w.q*w.r)}</span></span></div>`).join("")}
<p></p><b>2 · Slot &amp; location</b><div class="grid" style="margin-top:8px"><input type="text" value="10 Oct, 6:00 PM – 8:00 PM"><select><option>12th Main, Indiranagar, Bengaluru</option><option>Add new address…</option></select></div></div>
<div class="card"><div class="mut">Estimated value</div><div class="big" id="est">${f(est())}</div><p class="mut">Final amount is computed from the weighed quantity at pickup.</p>${map()}<p><button class="btn" onclick="set(1);setTimeout(()=>set(2,'Matching collectors near you…'),1300)">Create pickup request →</button></p></div></div>`;
let col=S.st>=2?`<div class="card"><b>Smart matching</b><p class="mut">Filter: available + within 5 km. Nearest notified first.</p>${COL.map(c=>{let ok=c[2]&&c[1]<=5,as=S.as==c[0];return `<div class="col"><div class="av">${c[0][0]}</div><div style="flex:1"><b>${c[0]}</b><div class="mut">${c[1]} km</div></div>${as?'<span class="badge ok">Assigned ✓</span>':!c[2]?'<span class="badge bz">Busy · skipped</span>':S.st>=3?'<span class="badge bl">Request already assigned</span>':'<span class="badge ok">Notified</span>'}</div>`}).join("")}</div>`:"";
let fa=S.st>=5?`<div class="card"><b>Final amount</b><table><tr><th>Item</th><th>Est.</th><th>Actual</th><th>Amount</th></tr>${W.map(w=>`<tr><td>${w.e} ${w.k}</td><td>${w.q} kg</td><td>${w.a} kg</td><td>${f(w.a*w.r)}</td></tr>`).join("")}<tr><td colspan=3><b>Total (est. ${f(est())})</b></td><td><b>${f(fin())}</b></td></tr></table></div>`:"";
return `<div class="row"><h2>Pickup #EL-2041</h2><span class="badge ${S.st==9?"ok":"bz"}">${STEPS[S.st-1]}</span></div><div class="grid g2" style="margin-top:14px"><div class="card"><b>Waste lifecycle</b><p></p>${tracker()}</div><div class="grid" style="align-content:start"><div class="card">${map()}</div>${col}</div></div><div class="grid" style="margin-top:16px">${fa}${S.st>=5?`<div class="card"><b>Your impact</b><p></p>${impact()}</div>`:""}</div>`}
function collector(){
let h=`<div class="row"><h2>Collector hub</h2><div class="row"><select style="width:auto" onchange="S.persona=this.value;render()">${["Ravi","Imran","Rahul"].map(n=>`<option ${n==S.persona?"selected":""}>${n}</option>`).join("")}</select><button class="btn ${S.on?"":"ghost"}" onclick="S.on=!S.on;render()">${S.on?"● Online":"○ Offline"}</button></div></div><div class="grid g4" style="margin:14px 0">${[["Today",S.st>=6?"₹375":"₹120"],["This week","₹2,140"],["This month","₹8,420"],["Avg / pickup","₹118"]].map(a=>`<div class="card"><div class="mut">${a[0]}</div><div class="big">${a[1]}</div></div>`).join("")}</div>`;
let d=COL.find(c=>c[0]==S.persona)[1];
if(!S.on)return h+`<div class="card" style="text-align:center;padding:40px">😴 You're offline.<br><span class="mut">Go online to receive nearby requests.</span></div>`;
if(S.st<2)return h+`<div class="card" style="text-align:center;padding:40px">📭 No requests nearby.<br><span class="mut">Create a pickup as Household to see one appear here.</span></div>`;
let rq=`<div class="card" style="border-color:var(--acc)"><div class="row"><b>🔔 New pickup · ${d} km away</b><span class="badge bz">6:00–8:00 PM</span></div><p>🧴 Plastic 8 kg · 📄 Paper 5 kg · 🔩 Metal 2 kg<br><span class="mut">Indiranagar · Aman</span></p><div class="row"><div class="big">${f(est())}</div>`;
if(S.st==2)return h+`<div class="grid g2"><div class="card" style="border:2px solid var(--acc);text-align:center"><div class="row"><span class="badge bz">NEW REQUEST</span><span class="mut">#EL-2041 · sent to 3 collectors</span></div><div style="position:relative;width:120px;margin:12px auto"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="8"/><circle id="ring" cx="60" cy="60" r="52" fill="none" stroke="var(--acc)" stroke-width="8" stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="${327*(1-TL/30)}" transform="rotate(-90 60 60)"/></svg><div id="tl" style="position:absolute;inset:0;display:grid;place-items:center;font:700 30px Georgia">${TL}s</div></div><div class="mut">You'll earn</div><div class="big">₹55</div><div class="mut">incl. ₹10 peak bonus · material value ${f(est())}</div><div style="text-align:left;margin:14px 0;display:grid;gap:8px"><div>🟠 <b>Pickup</b> · 12th Main, Indiranagar<br><span class="mut">${d} km · ~${Math.round(d*5)} min · 6:00–8:00 PM</span></div><div>🏭 <b>Drop</b> · GreenCycle, Whitefield<br><span class="mut">9.2 km</span></div><div>🧴 Plastic 8 kg · 📄 Paper 5 kg · 🔩 Metal 2 kg</div></div><div class="slide"><span>Slide to accept →</span><input type="range" min="0" max="100" value="0" oninput="if(+this.value>=96){S.as=S.persona;set(3,'Order accepted — ${S.persona} assigned')}" onchange="this.value=0"></div><p><button class="btn red" onclick="notify('collector','Request rejected','Offered to the next nearest collector.','↪️')">Reject</button></p></div><div class="card">${map()}</div></div>`;
if(S.as!=S.persona)return h+`<div class="card" style="text-align:center;padding:40px">🚫 <b>Request already assigned</b><br><span class="mut">${S.as} accepted it first. Staying online for the next one.</span></div>`;
let act=S.st==3?`<button class="btn" onclick="set(4,'Marked arrived')">I've arrived</button>`:S.st==4?`<b>Enter actual weight</b>${W.map((w,i)=>`<div class="item"><span>${w.e} ${w.k}</span><input type="number" step=".1" value="${w.a}" oninput="W[${i}].a=+this.value;document.getElementById('ft').textContent=f(fin())"><span class="mut">est ${w.q}</span></div>`).join("")}<p>Total: <b id="ft">${f(fin())}</b></p><button class="btn" onclick="set(5,'Collected · amount paid to household')">Confirm collection</button>`:S.st==5?`<button class="btn" onclick="set(6,'Handed over to GreenCycle Pvt Ltd')">Transfer to recycler</button>`:`<span class="badge ok">Pickup completed · you earned ₹${pay-Math.round(fin())+Math.round(fin()*0)} margin</span>`;
return h+`<div class="grid g2"><div class="card"><b>Active pickup · ${STEPS[Math.min(S.st,6)-1]}</b><p></p>${tracker()}<p>${act}</p></div><div class="card">${map()}</div></div>`}
function recycler(){
let h=`<h2>GreenCycle Recyclers</h2><p class="mut">Buy collected material → sort &amp; process → resell at a higher value.</p>`;
let R=resale(),P=R-pay-proc;
let eco=`<div class="grid g4" style="margin:12px 0">${[["Purchase",f(pay)],["Processing",f(proc)],["Resale value",f(R)],["Est. profit",f(P)]].map((a,i)=>`<div class="card"><div class="mut">${a[0]}</div><div class="big" style="color:${i==3?"var(--pri)":"inherit"}">${a[1]}</div></div>`).join("")}</div>`;
let inc=S.st<6?`<div class="card" style="text-align:center;padding:36px">📦 No incoming batches yet.<br><span class="mut">Complete a collector pickup to send material here.</span></div>`:`<div class="card"><div class="row"><b>Batch #B-883 · from ${S.as}</b><span class="badge ${S.st==9?"ok":"bz"}">${S.st==6?"Incoming":STEPS[S.st-1]}</span></div><table><tr><th>Material</th><th>Weight</th><th>Resale/kg</th><th>Resale value</th></tr>${W.map(w=>`<tr><td>${w.e} ${w.k}</td><td>${w.a} kg</td><td>₹${w.rs}</td><td>${f(w.a*w.rs)}</td></tr>`).join("")}</table><p>`+(S.st==6?`<button class="btn" onclick="set(7,'Material received')">Accept material (${f(pay)})</button>`:S.st==7?`<button class="btn" onclick="set(8)">Start sorting / processing</button>`:S.st==8?`<button class="btn" onclick="set(9,'♻ Batch recycled — impact added')">Mark recycled</button>`:`<span class="badge ok">Recycled · profit ${f(P)}</span>`)+`</p><div class="bar"><b style="width:${Math.max(0,(S.st-5)/4*100)}%"></b></div></div>`;
let inv=`<div class="card"><b>Inventory (kg)</b>${[["Plastic",620,800],["Paper",410,600],["Metal",190,300],["Glass",120,400],["E-waste",64,200]].map(a=>`<div style="margin:10px 0"><div class="row"><span>${a[0]}</span><span class="mut">${a[1]} / ${a[2]}</span></div><div class="bar"><b style="width:${a[1]/a[2]*100}%"></b></div></div>`).join("")}</div>`;
return h+eco+`<div class="grid g2">${inc}${inv}</div>`}
function admin(){
let tot=2480+(S.st>=9?15:0);
return `<h2>Platform overview</h2><div class="grid g4" style="margin:14px 0">${[["Households","1,284"],["Collectors","86"],["Recyclers","12"],["Active pickups",S.st>=2&&S.st<9?"38":"37"],["Completed","4,920"],["Waste collected",tot.toLocaleString()+" t"],["Waste recycled","1,960 t"],["Txn value","₹48.2 L"]].map(a=>`<div class="card"><div class="mut">${a[0]}</div><div class="big">${a[1]}</div></div>`).join("")}</div>
<div class="grid g2"><div class="card"><b>Waste by category</b>${[["Plastic",38],["Paper",27],["Metal",18],["Glass",10],["E-waste",7]].map(a=>`<div style="margin:10px 0"><div class="row"><span>${a[0]}</span><span class="mut">${a[1]}%</span></div><div class="bar"><b style="width:${a[1]*2.5}%"></b></div></div>`).join("")}</div>
<div class="card"><b>Recent activity</b><table>${[S.st>=9?["Batch B-883 recycled","now"]:S.st>=2?["Pickup EL-2041 in progress","now"]:["Pickup EL-2040 completed","4m"],["Imran accepted EL-2039","12m"],["GreenCycle received 120 kg","1h"],["New collector: Karan","3h"]].map(a=>`<tr><td>${a[0]}</td><td class="mut">${a[1]}</td></tr>`).join("")}</table></div></div>
<div class="card" style="margin-top:16px"><b>Collector management</b><table><tr><th>Name</th><th>Status</th><th>Pickups</th><th>Rating</th></tr>${[["Ravi","Online",412,"4.9"],["Imran","Online",358,"4.8"],["Suresh","Busy",290,"4.7"],["Rahul","Online",201,"4.6"]].map(a=>`<tr><td>${a[0]}</td><td><span class="badge ${a[1]=="Busy"?"bz":"ok"}">${a[1]}</span></td><td>${a[2]}</td><td>★ ${a[3]}</td></tr>`).join("")}</table></div>`}
function home(){return `<div class="hero"><span class="pill" style="width:fit-content">Waste → Value → Planet</span><h1>Turn household waste into income. Track every gram.</h1><p style="max-width:560px;opacity:.9">EcoLoop connects households, scrap collectors and recyclers in one transparent, trackable loop.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" style="background:#fff;color:var(--pri)" onclick="go('household')">Start demo as Household →</button><button class="btn" style="background:rgba(255,255,255,.18)" onclick="go('admin')">View admin analytics</button></div></div>
<div class="grid g2" style="margin-top:16px">${[["🏠","Households","Schedule pickups, see value upfront, earn points."],["🛵","Collectors","Swiggy-style nearby requests, earn per pickup."],["🏭","Recyclers","Buy, process and resell — margin you can see."]].map(a=>`<div class="card"><div style="font-size:28px">${a[0]}</div><h3>${a[1]}</h3><p class="mut">${a[2]}</p></div>`).join("")}</div>
<div class="card" style="margin-top:16px"><b>Demo flow</b><p class="mut">Household creates pickup → Collector tab: Accept → Arrive → enter weights → Transfer → Recycler tab: Accept → Process → Recycled → Admin.</p></div>`}
let N=[],NP=false;const RN={household:'Household (Aman)',collector:'Collector',recycler:'Recycler',admin:'Admin'};
function notify(r,t,b,ic){let o={r,t,b,ic,u:1,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};N.unshift(o);let d=document.createElement('div');d.className='nb';d.innerHTML=`<span style="font-size:22px">${ic}</span><div><div class="mut">To ${RN[r]} · now</div><b>${t}</b><div class="mut">${b}</div></div>`;document.getElementById('nbs').append(d);setTimeout(()=>d.remove(),5000)}
const NOTES={1:()=>notify('household','Pickup requested','EL-2041 for 10 Oct, 6–8 PM. Est. value ₹350.','📝'),
2:()=>{notify('household','Finding a collector','Notifying 3 available collectors within 5 km. Suresh is busy and was skipped.','🔍');notify('collector','🔔 New pickup request','0.8 km away · you earn ₹55 · accept within 30s.','🛵');notify('admin','Pickup EL-2041 broadcast','3 collectors notified. Match window 30s.','📡')},
3:()=>{notify('household',S.as+' accepted your pickup','Arriving in about 6 min. Keep waste sorted and ready.','✅');notify('collector','Pickup assigned to you','Head to 12th Main, Indiranagar. Route ready.','🧭');notify('collector','Request already assigned','Other collectors were told '+S.as+' accepted first.','🚫')},
4:()=>{notify('household',S.as+' has arrived','Share OTP 4821 to confirm handover.','📍');notify('collector','You have arrived','Weigh each category and enter actual weight.','⚖️')},
5:()=>{notify('household','Waste collected · '+f(fin())+' credited','Actual 14.5 kg. +340 recycling points. Receipt saved.','💰');notify('collector','Collection confirmed','Deliver the batch to GreenCycle, Whitefield (9.2 km).','📦')},
6:()=>{notify('recycler','📦 Incoming batch B-883','14.5 kg from '+S.as+'. Resale value '+f(resale())+'. Accept to confirm.','🏭');notify('household','On its way to the recycler','Your waste is being transferred to GreenCycle.','🚚')},
7:()=>{notify('collector','GreenCycle received your batch','Payout '+f(375)+' credited. Rated 5★ by recycler.','💸');notify('household','Received by GreenCycle','Sorting begins shortly.','📥')},
8:()=>{notify('household','Sorting and processing','Your plastic, paper and metal are being separated and cleaned.','⚙️');notify('admin','Batch B-883 in processing','Processing cost est. ₹60.','⚙️')},
9:()=>{notify('household','♻️ Your waste was recycled!','4.8 kg CO₂ saved · 120 L water conserved · 340 pts.','🌍');notify('recycler','Batch B-883 recycled','Estimated profit '+f(resale()-375-60)+'. Added to inventory.','📈');notify('admin','Batch B-883 completed','Platform recycled total +14.5 kg.','🏆')}};
function set(n,msg){S.st=n;if(NOTES[n])NOTES[n]();else msg&&toast(msg);render()}
function reset(){N=[];NP=false;S.st=0;S.as=null;W.forEach((w,i)=>w.a=[7.5,5.2,1.8][i]);render();toast('Demo reset')}
function render(){clearInterval(TI);const T={home:["Home",home],household:["Household",household],collector:["Collector",collector],recycler:["Recycler",recycler],admin:["Admin",admin]};
document.getElementById("nav").innerHTML=Object.keys(T).map(k=>`<button class="${S.v==k?"on":""}" onclick="go('${k}')">${T[k][0]}</button>`).join("");
document.getElementById("st").textContent=S.st?`Stage ${S.st}/9 · ${STEPS[S.st-1]}`:"No active pickup";
document.getElementById("app").innerHTML=T[S.v][1]();let L=N.filter(x=>x.r==S.v),uc=L.filter(x=>x.u).length,B=document.getElementById('bell'),P=document.getElementById('np');
B.style.display=S.v=='home'?'none':'';B.textContent='🔔'+(uc?' '+uc:'');
if(NP&&S.v!='home'){P.style.display='block';P.innerHTML='<b>Notifications · '+RN[S.v]+'</b>'+(L.length?L.map(x=>`<div class="ni ${x.u?'u':''}"><span style="font-size:20px">${x.ic}</span><div><b>${x.t}</b><div class="mut">${x.b}</div><div class="mut">${x.time}</div></div></div>`).join(''):'<p class="mut">No messages yet.</p>');L.forEach(x=>x.u=0)}else P.style.display='none';
window.scrollTo(0,0);if(S.v=="collector"&&S.st==2&&S.on){TL=30;TI=setInterval(()=>{TL--;let r=document.getElementById("ring");if(!r){clearInterval(TI);return}document.getElementById("tl").textContent=TL+"s";r.setAttribute("stroke-dashoffset",327*(1-TL/30));if(TL<=0){clearInterval(TI);toast("Request expired — re-offered to next collector");render()}},1000)}}
render();
</script></body></html>
